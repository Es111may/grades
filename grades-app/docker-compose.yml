# Docker compose для локальной разработки.
# В проде используем внутреннюю инфраструктуру компании.

services:
  postgres:
    image: postgres:16-alpine
    container_name: grades-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: grades
      POSTGRES_PASSWORD: grades_dev
      POSTGRES_DB: grades
    ports:
      - "5432:5432"
    volumes:
      - grades-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grades -d grades"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  grades-pgdata:
